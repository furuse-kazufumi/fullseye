[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fullseye"
version = "0.1.8"
description = "Numpy-native operator library for vision, 3-D and measurement (1,500+ typed ops: imaging, point clouds, optics, tomography, metrology) with an evolutionary pipeline designer and honest holdout gating"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Kazufumi Furuse", email = "kazufumi@furuse.work" }]
keywords = ["image-processing", "computer-vision", "evolutionary-algorithm", "pipeline", "operators"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Visualization",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
  "Typing :: Typed",
]
# The core (75 ops) runs on numpy + scipy alone. Everything else is optional and
# only its own operators are affected when a backend is absent (graceful degradation).
dependencies = ["numpy>=1.23", "scipy>=1.9"]

# PyPI ⇄ GitHub の相互リンク(PyPI プロジェクトページのサイドバーに出る)。
# 公開リポジトリ名は公開名 fullseye(リネーム時はここを追従させる)。
[project.urls]
Homepage = "https://github.com/furuse-kazufumi/fullseye"
Repository = "https://github.com/furuse-kazufumi/fullseye"
Documentation = "https://github.com/furuse-kazufumi/fullseye/tree/master/docs"
"Operator corpus (RAG)" = "https://github.com/furuse-kazufumi/fullseye/tree/master/docs/ops"
"Bug tracker" = "https://github.com/furuse-kazufumi/fullseye/issues"

[project.optional-dependencies]
opencv = ["opencv-python>=4.6"]
skimage = ["scikit-image>=0.20"]
pil = ["Pillow>=9"]
wavelets = ["PyWavelets>=1.4"]
gpu = ["torch>=2.0", "kornia>=0.7"]
extra = ["mahotas>=1.4", "SimpleITK>=2.2"]
gui = ["PySide6>=6.5"]
handpose = ["mediapipe>=0.10"]
video = ["imageio>=2.28", "imageio-ffmpeg>=0.4"]
audio = ["soundfile>=0.12"]          # non-WAV audio (mp3/flac/ogg); WAV is built-in
volume = ["SimpleITK>=2.2", "tifffile>=2023.1"]   # volumetric/medical import: DICOM/NIfTI/NRRD/MetaImage/TIFF -> volume sort
raster = ["imageio>=2.28", "tifffile>=2023.1"]    # bit-depth-preserving raster (16-bit/float/PFM) + metric depth I/O
gltf = ["pygltflib>=1.16"]                        # glTF 2.0 / GLB object import
lidar = ["laspy>=2.5", "lazrs>=0.5"]              # LAS / LAZ LiDAR point clouds
pcd = ["pypcd4>=1.4"]                             # PCD binary / binary_compressed point clouds
# 2026-09-05: deptry(依存の宣言漏れ検査)で見つけた —— 出荷モジュール
# contours_xld / regions_gen が `matplotlib.path.Path` を**関数内で遅延 import**
# しており、どの extra にも宣言が無かった。import は通るので clean install の
# smoke でも気づけず、**呼んだときに黙って fallback へ落ちる**だけだった
# (fail-soft が「機能が入っていない」を隠す典型)。宣言して利用者が選べるようにする。
# より良い直しは自前の `point_in_polygon`(厳密述語、既に公開 API にある)へ
# 置き換えること —— 境界の扱いが変わりうるので 0.1.9 で検証してから。
polygon = ["matplotlib>=3.5"]                     # 多角形の塗りつぶし(点の内外判定)
threed = ["torch>=2.0", "scikit-image>=0.20", "SimpleITK>=2.2"]   # 3-D toolkit: GPU descriptors (feat_*), marching cubes, DICOM/volume I/O
# --- connectivity (device control / industrial + Physical-AI comms) ---
# The native transports (TCP/UDP/Modbus-TCP/HTTP) need nothing beyond stdlib;
# these extras add optional protocol/device adapters.
serial = ["pyserial>=3.5"]
modbus = ["pymodbus>=3.0"]            # Modbus RTU (Modbus TCP is built-in)
mqtt = ["paho-mqtt>=1.6"]
opcua = ["asyncua>=1.0"]
# contributor toolchain (CI mirror)。道具は「今日踏んだ失敗の型」で選んでいる ——
# timeout=ハング、hypothesis=退化入力の性質検査、randomly=状態漏れ、
# pip-audit=依存の既知脆弱性、ruff=黙って消える定義(F601 で実害を 1 件検出)。
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.4", "pytest-timeout>=2.3",
       "hypothesis>=6.100", "pytest-randomly>=3.15", "pytest-xdist>=3.5",
       "pip-audit>=2.7"]
# pytest-xdist は速さのためではなく**順序依存を出すため**に入れている ——
# ワーカーの使い回しでテストの並びが崩れ、モジュール大域の漏れが顕在化する
# (2026-09-05 実測で 1 件)。`pytest -p randomly -n auto` が週次 CI の
# `order-shuffle` ジョブと同じ走らせ方。
# ★`flaky` は入れない —— 失敗を握り潰す道具であって、見つける道具ではない。
# `all` = the full desktop app (image libs + GPU + GUI + video). Industrial/robotics
# adapters stay opt-in (a desktop user does not need pymodbus/asyncua by default).
all = [
  "opencv-python>=4.6", "scikit-image>=0.20", "Pillow>=9", "PyWavelets>=1.4",
  "torch>=2.0", "kornia>=0.7", "mahotas>=1.4", "SimpleITK>=2.2",
  "PySide6>=6.5", "imageio>=2.28", "imageio-ffmpeg>=0.4", "tifffile>=2023.1",
]

[project.scripts]
fullseye = "imgevolve:main"
fullseye-studio = "studio:main"
fullseye-rag = "fullseye.rag_setup:main"      # Claude Code RAG skill installer (docs/AI_RAG_GUIDE.md)

[tool.setuptools]
# The public facade is the `fullseye` package; the engine is a set of flat
# top-level modules kept at the repo root (historical layout). Both are shipped.
# `studio_assets` is a data-only package (i18n / op help / sample images) — it is
# declared here so package-data below carries its files into the wheel; the Studio
# loads them by path relative to studio.py, which resolves to the shipped copy.
packages = ["fullseye", "studio_assets", "examples_3d", "examples"]
py-modules = [
  # `torch_lazy` is the lazy torch/torch.nn.functional shim imported by
  # accel_match / match3d / feat_* — it MUST ship or those modules ImportError
  # on a pip install (it keeps `import torch`, ~700 ms, off every start-up).
  "api", "param_specs", "ops", "backend_safe", "torch_lazy",
  "backends", "backends_auto", "backends_color", "backends_cv2b", "backends_dl",
  "backends_extra", "backends_kornia", "backends_pil", "backends_r3",
  "backends_scipy", "backends_ski2",
  "backends_decomp", "backends_filters2", "backends_imgtools", "backends_inverse",
  "backends_measure1d", "backends_physics", "backends_regions2", "backends_regions3",
  "backends_segment2", "backends_subpix", "backends_tomo", "backends_transform2",
  "backends_xldgeom",
  "backends_aug", "backends_alife", "backends_alife2", "backends_tactile", "backends_deform",
  "backends_macro", "macro_champions_data", "auto_specs_data", "halcon_names_data",
  "imgops_nary", "scale", "stereo", "terrain", "locomotion", "occupancy", "imgio", "detect", "registration", "deformreg", "ppf", "pose",
  "unified", "sim_source", "oss_adapter", "filters_flow", "matching3d",
  "calib", "matching", "mosaic", "objmodel3d", "pose_quat", "reconstruction", "transforms",
  "pointcloud", "pcseg", "mesh", "meshio_opt", "volio", "raster", "render3d", "camera", "odometry", "grasp", "meshrepair", "volops", "volregion", "volgray", "volxform", "volprobe", "volfreq", "volrestore", "handpose", "complexops", "specops", "flow", "motion", "sceneflow", "features", "events", "video", "videops", "engine", "graphengine", "acquire", "comm", "device", "dsp", "funct1d", "mathops", "predicates", "precision_union", "geompred", "matappear", "glassmirror", "metalfinish", "surfacelib", "opassist", "ops1d", "opsmath", "optics",
  "optscene", "raytrace", "lensopt", "illumdesign", "lensimage", "opsoptics", "visiondesign", "defectgen", "visionlab", "lightfield", "opslightfield", "photoncount", "opsphoton", "specularity", "opsspecular", "motionmag", "opsmotionmag", "gfx2d", "opsgfx2d", "quatimage", "opsquat", "rangedoppler", "opsrangedoppler", "interferometry", "opsinterferometry", "opsinterferometry", "acoustics", "opsacoustics", "cadmap", "opscadmap", "volcolor", "opsvolcolor", "tomography", "opstomography", "palette", "annotate", "opsannotate", "reprconv", "opsreprconv", "imgmetrics", "opsimgmetrics", "colortransport", "opscolortransport", "imgforensics", "opsimgforensics", "astrostack", "opsastrostack", "meshres", "videostream", "opsvideostream", "annotate3d", "contours_xld", "metriccontract", "fssystem",
  "recipes", "measure", "studio", "sample_images", "sample_data", "accuracy_bench",
  "evolve", "problems", "baseline", "robust",
  "verify_auto", "honest_summary", "dispositions", "catalog", "report",
  "samples", "references", "codegen", "difftest", "parity", "accel", "accel_bridge", "accel_match", "accel_vol", "bench",
  # CPU 高速 twin テーブル(cv2/IPP)。api._try_fast が import するので wheel に要る
  "fast",
  "algo", "algo_codegen", "algo_difftest", "synth",
  "sweep", "graph", "graph_seed", "lib_coverage",
  "halcon_coverage", "halcon_rad_ingest", "halcon_scrape", "imgevolve",
  "fscript", "fslib", "fsruntime", "fsi18n",
  # --- geometric / math / drawing op modules + 2-D examples gallery (対話で追加) ---
  "imagemorph", "fourierdesc", "imagedraw", "drawstyle", "drawlist", "signal1d", "examples2d",
  # `color_pca` は **HALCON facade の 11 op の実体**(create_color_trans_lut /
  # inpainting_ced / inpainting_mcf / inpainting_texture / exhaustive_match_mg /
  # gen_principal_comp_trans / gen_canonical_variates_trans / …)。
  # ops.REGISTRY には 1 つも登録されないので「どこからも使われていない」ように見えるが、
  # unified.py の facade 層が data/halcon_facade_map.json 経由で import している。
  # ここに無かったあいだ、pip install した wheel では **その 11 op が黙って消えていた**
  # (_load_facade が import 失敗を `except: continue` で握るので、エラーも警告も出ない)。
  # 2026-09-05: tests/test_unified.py が facade map の全参照の解決を検査する。
  #
  # --- HALCON facade(600 op)の実体モジュール ----------------------------------
  # これらは **文字列参照でしか import されない**(unified._load_facade が
  # data/halcon_facade_map.json の "<module>.<func>" を解決する)。したがって
  # `import X` を探す test_every_runtime_root_module_is_in_py_modules には映らず、
  # ここに書かれるまで **wheel から丸ごと落ちていた**。
  # 実測 2026-09-05: 600 facade op のうち **321 op(54%)** が `pip install fullseye`
  # では黙って消えていた(_load_facade が ImportError を握るので警告すら出ない)。
  # 内訳の上位: matrix 46 / shapematch 32 / geometry2d 20 / image_channels 20 /
  # contours_xld2 20 / final_genuine 20 / filters_freq 18 / regions_setops 17。
  "color_pca", "matrix", "shapematch", "geometry2d", "image_channels",
  "contours_xld2", "final_genuine", "final_genuine2", "filters_freq",
  "filters_arith", "regions_setops", "regions_gen", "region_morph",
  "morph_minkowski", "tools_geom", "misc_vision", "image_gen", "image_paint",
  "caltab", "calibration3d", "segmentation", "metrology", "measuring1d",
  "inspection", "scattered",
  # shapematch が import する GPU twin(上の 24 件を足して初めて表に出た依存)。
  "shapematch_gpu",
  # --- 3-D vision toolkit (ops3d registry + method modules) + examples gallery ---
  "examples3d", "ops3d", "measure3d", "pipeline3d", "pipeline_evolve", "evolve_params", "metrics3d", "match3d", "bspline_surf", "bundle3d", "curvature3d", "curve3d", "deform3d", "depth_bilateral", "descriptors3d", "edges3d", "feat_fpfh", "feat_harris", "feat_shot", "feat_spin", "fringe", "fuse3d", "geodesic3d", "gicp", "medial", "moments3d", "motion_seg3d", "normals_orient", "pcl_augment", "pcl_filter", "photometric", "plane_sweep", "pnp3d", "pose_graph", "range_image", "ransac_fit", "recon3d", "regionprops3d", "registration_eval", "scene_flow3d", "sdf_ops", "segment3d", "spherical_proj", "superquadric", "symmetry3d", "tsdf_fusion", "twoview", "visualhull",
  # 3-D mesh / rendering support (imported by ops3d.py + render_beauty.py)
  "fit_primitives_ext", "hull3d", "mesh_props", "mesh_smooth", "render_ao", "render_beauty", "render_shade", "render_shadow", "render_ssaa", "render_tonemap",
  # imported by shipped examples/examples_3d (release audit 2026-08-30: these were
  # missing, so the corresponding samples ImportError'd on a pip install)
  "mesh_decimate", "watershed3d", "g1_policy_bridge", "evis_fullseye_bridge",
  # imported by studio.py (gray_features dev ops, 2026-08-30) — must ship in the wheel
  "image_gray",
  # `fit_transform` (point-correspondence -> affine/rigid/similarity, Umeyama) has been
  # in the tree since 2026-08-18 but nothing shipped imported it, so the packaging check
  # never saw it. It became reachable at runtime when astrostack/imgforensics started
  # using it for frame alignment and copy-move geometry (2026-09-02) — without this line
  # both families would ImportError on a non-editable wheel.
  "fit_transform",
]

[tool.setuptools.package-data]
# The AI-facing operator catalog (LLM ledger) and the sensor playbook (sensor ->
# recommended op pipeline) are generated into the `fullseye` package by
# tools/gen_op_catalog.py and tools/gen_sensor_playbook.py, and shipped so an
# installed wheel carries them.
"fullseye" = ["OP_CATALOG.md", "SENSOR_PLAYBOOK.md",
              # Claude Code RAG skill template — lets a PyPI (wheel) install run
              # `fullseye-rag` without a repo checkout (docs/AI_RAG_GUIDE.md).
              "skill_template/SKILL.md",
              # fsi18n shipped message tables (English template -> translation);
              # user tables in FULLSEYE_I18N_DIR override these (docs/I18N.md).
              "i18n/*.json",
              # Canonical facade / disposition data (unified.py + dispositions.py
              # read these; the root-level data/ dir is only a dev-cache fallback
              # and never ships).
              "data/halcon_facade_map.json", "data/halcon_stubs.json",
              "data/halcon_graph.json"]
# Studio runtime assets shipped inside the `studio_assets` package so an installed
# wheel has localisation, per-operator help, and the bundled sample images (the
# Studio degrades to English-only / no-help / no-samples without them).
#
# Note: the flat root-level `data/` directory is deliberately NOT shipped — it is
# gitignored (a regenerable dev cache) and, being in no package, cannot ride a
# flat-layout wheel anyway. The runtime that needs it uses the data-as-code stores
# (`halcon_names_data` / `auto_specs_data` / `macro_champions_data`) instead, which
# always ship as .py modules.
"studio_assets" = ["*.json", "op_help/*.html", "op_help/*.md",
                   "sample_images/*.png", "sample_images/*.json",
                   "sample_thumbs/*.png", "sample_thumbs/*.json",
                   # `sample_sources_ai/`(AI 生成の記事用素材 26 枚)は **同梱しない**。
                   # 出荷コードからは 1 箇所も読まれず(参照は tools/fops_article/ =
                   # 記事生成の開発ツールと docs/ の仕様書だけ)、それでいて
                   # **wheel の 58%(圧縮後 42.1 MB / 全体 72.0 MB)** を占めていた。
                   # 読まないものを配らない ―― これを外すと wheel は 30 MB になる。
                   # リポジトリには残るので記事の再生成には支障しない。
                   "sample_3d/*.npy", "sample_3d/*.md",
                   # 3-D **と全ての台帳族**(math / optics / imgmetrics / …)の help。
                   # ここが `op_help/3d/*.html` だけを挙げていたあいだ、
                   # `tools/opdocs.py html` が生成してリポジトリにコミットされていた
                   # 494 枚の台帳ヘルプは **wheel に 1 枚も入っていなかった**
                   # (2026-09-05 実測)。族が増えても落ちないようワイルドカードにする。
                   # `<op>.<lang>.html`(en / zh / tw / ko / de)も同じ glob に入る。
                   "op_help/*/*.html"]

[tool.pytest.ini_options]
# 2026-09-05 に追加。**今日実際に踏んだ 2 つの失敗の型**に効かせるための設定:
#
# 1. ネイティブ側のクラッシュ —— `xpil_offset` に 0x0 画像を渡すと Pillow の中で
#    プロセスごと死に(exit 127)、Python の例外にならないので try/except でも
#    backend_safe.guard でも捕まらなかった。`faulthandler` は落ちた瞬間の
#    C/Python スタックを吐くので、「どこで死んだか分からない」状態を避けられる。
# 2. ハング —— `xsk_unwrap_phase` に全 NaN を渡すと 5 分以上返ってこなかった。
#    クラッシュより厄介で、CI では「遅い」としか見えない。時間で切って
#    **どのテストで止まったか**を出す。
faulthandler_timeout = 180
timeout = 900
timeout_method = "thread"     # Windows には signal 方式が無い
testpaths = ["tests"]
# 実行順のランダム化(pytest-randomly)は既定では切る —— この repo は
# レジストリや台帳をモジュール大域に持つので、順序依存が出た瞬間に
# 本題と無関係な赤が出る。専用ジョブで意図的に走らせて、出た漏れを潰す。
addopts = "-p no:randomly"

[tool.ruff]
# 静的解析は**様式を揃えるためではなく、実害のあるバグを止めるために**入れている。
# 2026-09-05 に導入。きっかけは、11,254 件のテストが全部緑のまま
# `tools/chain_fuzz.py` の辞書キー重複(F601)が見逃されていたこと ——
# `"rgbimage"` が二重定義され、**後勝ちの一様乱数が、意図をもって書かれた
# 二色性反射レンダを黙って殺していた**。そのせいで鏡面分離 op 2 本が
# 「物理条件を満たす絵が一度も来ない」ため永久に拒否され、「死んだ op」として
# 台帳に載っていた。同じ重複があと 3 組(radius / leader_line / sphere_sdf.R)。
line-length = 100
target-version = "py310"
extend-exclude = ["experiments", "out", ".out", "docs"]

[tool.ruff.lint]
# **絞る**。この repo の書き方(printf 形式の書式・fail-soft の裸 except)を
# 様式違反として大量に出すルールは、信号を雑音に埋めるので入れない。
# 残すのは「実行時に壊れる/黙って消える」クラスだけ。
select = [
    "F",      # pyflakes: 未定義名・未使用 import・**辞書キーの重複**
    "E9",     # 構文/IO エラー
    "B",      # bugbear: ループ変数を閉じ込めた関数、except からの raise など
    "PLE",    # pylint error: 実行時に確実に壊れるもの
    "RUF012", # ミュータブルなクラス属性の既定値
    "RUF013", # 暗黙の Optional
]
ignore = [
    # この repo の設計・書き方として意図的なもの(理由つきで無効化する)
    "B905",   # zip(strict=) —— 呼び出し側で長さを保証している箇所が多い
    "B007",   # 使わないループ変数(_ 命名を強制しない)
    "B904",   # except 内の raise ... from —— fail-soft 台帳が出所を持つ
    "B008",   # 引数既定での関数呼び出し
    "F401",   # 未使用 import(optional backend の存在確認に使う形がある)
    "F541",   # プレースホルダの無い f-string
    "F841",   # 未使用のローカル変数(実測の途中結果を残す書き方がある)
    # B023(ループ変数を閉じ込めた関数)= 66 件を実地で確認したところ、**全部が
    # 「同じ反復の中で定義して即使う」補助関数**だった(render3d の mid、
    # evolve_params の pick 等)。この形は安全で、B023 には区別できない。
    # 本当に危ないのは「クロージャを表に溜めて後で呼ぶ」形だが、backend の op 表は
    # `_f=fn` の既定束縛で対処済みで、**しかもそれは実行時に測れる** ——
    # 束縛を間違えれば複数の op が同じ出力を返すので、
    # tests/test_op_knob_liveness.py が名指しで落とす。静的な近似より実測を採る。
    "B023",
    # RUF012 / RUF013 は型注釈の作法(ClassVar 注釈・暗黙 Optional)。
    # 実地で確認した 48 件はすべて「変更しない定数表」と「既定 None」で、
    # 実行時の不具合ではない。型チェッカを入れる日に一緒に片づける。
    "RUF012", "RUF013",
]

[tool.ruff.lint.per-file-ignores]
# テストは「わざと壊す」コードを書く場所なので、そこだけ緩める
"tests/*" = ["B017", "F811"]

[tool.coverage.run]
# ライブラリ本体のカバレッジを測る(テスト・開発ツール・研究スクラッチは対象外)。
omit = ["tests/*", "tools/*", "spikes/*", "setup.py", "conftest.py",
        "vloop*", "janken*", "fullseye_3dgs*", "gsplat_*", "examples/*", "examples_3d/*"]

[tool.coverage.report]
skip_empty = true
