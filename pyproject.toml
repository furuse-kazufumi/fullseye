[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fullseye"
version = "0.1.0"
description = "Evolvable image-processing operator library and honest pipeline designer (numpy-native, optional GPU)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "furuse-kazufumi" }]
keywords = ["image-processing", "computer-vision", "evolutionary-algorithm", "pipeline", "operators"]
# The core (75 ops) runs on numpy + scipy alone. Everything else is optional and
# only its own operators are affected when a backend is absent (graceful degradation).
dependencies = ["numpy>=1.23", "scipy>=1.9"]

[project.optional-dependencies]
opencv = ["opencv-python>=4.6"]
skimage = ["scikit-image>=0.20"]
pil = ["Pillow>=9"]
wavelets = ["PyWavelets>=1.4"]
gpu = ["torch>=2.0", "kornia>=0.7"]
extra = ["mahotas>=1.4", "SimpleITK>=2.2"]
gui = ["PySide6>=6.5"]
video = ["imageio>=2.28", "imageio-ffmpeg>=0.4"]
audio = ["soundfile>=0.12"]          # non-WAV audio (mp3/flac/ogg); WAV is built-in
volume = ["SimpleITK>=2.2", "tifffile>=2023.1"]   # volumetric/medical import: DICOM/NIfTI/NRRD/MetaImage/TIFF -> volume sort
raster = ["imageio>=2.28", "tifffile>=2023.1"]    # bit-depth-preserving raster (16-bit/float/PFM) + metric depth I/O
gltf = ["pygltflib>=1.16"]                        # glTF 2.0 / GLB object import
lidar = ["laspy>=2.5", "lazrs>=0.5"]              # LAS / LAZ LiDAR point clouds
pcd = ["pypcd4>=1.4"]                             # PCD binary / binary_compressed point clouds
# --- connectivity (device control / industrial + Physical-AI comms) ---
# The native transports (TCP/UDP/Modbus-TCP/HTTP) need nothing beyond stdlib;
# these extras add optional protocol/device adapters.
serial = ["pyserial>=3.5"]
modbus = ["pymodbus>=3.0"]            # Modbus RTU (Modbus TCP is built-in)
mqtt = ["paho-mqtt>=1.6"]
opcua = ["asyncua>=1.0"]
# `all` = the full desktop app (image libs + GPU + GUI + video). Industrial/robotics
# adapters stay opt-in (a desktop user does not need pymodbus/asyncua by default).
all = [
  "opencv-python>=4.6", "scikit-image>=0.20", "Pillow>=9", "PyWavelets>=1.4",
  "torch>=2.0", "kornia>=0.7", "mahotas>=1.4", "SimpleITK>=2.2",
  "PySide6>=6.5", "imageio>=2.28", "imageio-ffmpeg>=0.4", "tifffile>=2023.1",
]

[project.scripts]
fullseye = "imgevolve:main"
fullseye-studio = "studio:main"

[tool.setuptools]
# The public facade is the `fullseye` package; the engine is a set of flat
# top-level modules kept at the repo root (historical layout). Both are shipped.
# `studio_assets` is a data-only package (i18n / op help / sample images) — it is
# declared here so package-data below carries its files into the wheel; the Studio
# loads them by path relative to studio.py, which resolves to the shipped copy.
packages = ["fullseye", "studio_assets"]
py-modules = [
  "api", "ops", "backend_safe",
  "backends", "backends_auto", "backends_color", "backends_cv2b", "backends_dl",
  "backends_extra", "backends_kornia", "backends_pil", "backends_r3",
  "backends_scipy", "backends_ski2",
  "backends_decomp", "backends_filters2", "backends_imgtools", "backends_inverse",
  "backends_measure1d", "backends_physics", "backends_regions2", "backends_regions3",
  "backends_segment2", "backends_subpix", "backends_tomo", "backends_transform2",
  "backends_xldgeom",
  "backends_aug", "backends_alife", "backends_alife2", "backends_tactile", "backends_deform",
  "backends_macro", "macro_champions_data", "auto_specs_data", "halcon_names_data",
  "imgops_nary", "scale", "stereo", "terrain", "locomotion", "occupancy", "imgio", "detect", "registration", "deformreg", "ppf", "pose",
  "unified", "sim_source", "oss_adapter", "filters_flow", "matching3d",
  "calib", "matching", "mosaic", "objmodel3d", "pose_quat", "reconstruction", "transforms",
  "pointcloud", "pcseg", "mesh", "meshio_opt", "volio", "raster", "render3d", "camera", "odometry", "grasp", "meshrepair", "volops", "complexops", "specops", "flow", "motion", "sceneflow", "features", "events", "video", "videops", "engine", "graphengine", "acquire", "comm", "device", "dsp",
  "recipes", "measure", "studio", "sample_images", "accuracy_bench",
  "evolve", "problems", "baseline", "robust",
  "verify_auto", "honest_summary", "dispositions", "catalog", "report",
  "samples", "references", "codegen", "difftest", "parity", "accel", "bench",
  "algo", "algo_codegen", "algo_difftest", "synth",
  "sweep", "graph", "graph_seed", "lib_coverage",
  "halcon_coverage", "halcon_rad_ingest", "halcon_scrape", "imgevolve",
  "fscript", "fslib", "fsruntime",
]

[tool.setuptools.package-data]
# Studio runtime assets shipped inside the `studio_assets` package so an installed
# wheel has localisation, per-operator help, and the bundled sample images (the
# Studio degrades to English-only / no-help / no-samples without them).
#
# Note: the flat root-level `data/` directory is deliberately NOT shipped — it is
# gitignored (a regenerable dev cache) and, being in no package, cannot ride a
# flat-layout wheel anyway. The runtime that needs it uses the data-as-code stores
# (`halcon_names_data` / `auto_specs_data` / `macro_champions_data`) instead, which
# always ship as .py modules.
"studio_assets" = ["*.json", "op_help/*.html", "op_help/*.md",
                   "sample_images/*.png", "sample_images/*.json"]
