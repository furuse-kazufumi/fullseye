# GitHub Pages(Jekyll)の設定。docs/ をそのまま https://furuse.work/ として配信する。
#
# ★配備は .github/workflows/pages.yml(Actions 方式、2026-11-11 から)。この設定で組んだ _site から、
# どのページからも参照されていない articles/assets/** を外してから配備する(配備物が 1 GB の上限を超えたため)。
# repo からは消さない(Qiita が raw URL で読む)。外し方と門は tools/pages_site.py と CONTRIBUTING.md。
#
# ★`include` が要る理由(2026-09-07): Jekyll は `_` で始まるディレクトリを
# **配信しない**(Jekyll の内部ディレクトリ規約)。op ごとの図を `docs/ops/_fig/`
# に置いたところ、手元では全リンクが通り、門も緑で、公開サイトでは 724 枚が
# 全部 404 だった。「門は事故の起きる場所に立てる」の再演 —— 配信側の規則は
# 配信側でしか見えない。`tests/test_docs_index_reachable.py` が、リンクされて
# いる `_` ディレクトリがここに列挙されていることを確かめる。
include:
  - _fig

# ★`docs/` はそのまま配信されるので、**作業メモまで公開ページになる**(2026-09-25)。
# `SESSION_SUMMARY.md` は Stop フックが毎ターン書き換える手元の作業記録で、
# 文書ではない(作業ディレクトリの絶対パスも載る)。配信から外す。
# `tests/test_docs_no_local_paths.py` が「ローカル絶対パスが公開範囲に無いこと」を見る。
exclude:
  - SESSION_SUMMARY.md
