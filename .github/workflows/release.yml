# Fullseye CD — タグ push で PyPI へ公開(clean checkout からビルド)
# Tag vX.Y.Z → sdist+wheel build → PyPI upload. Building from a clean checkout
# is deliberate: the 2026-08-30 audit showed in-place builds can pick up stale
# local caches (.pyc) that a clean tree never ships.
name: Release to PyPI

on:
  push:
    tags: ["v*"]

# 2026-10-24: PyPI の Trusted Publishing(OIDC)に移した。API トークンを使わない。
# 公開元の登録(PyPI 側): owner furuse-kazufumi / repo fullseye / workflow release.yml / environment pypi。
# 建てるジョブと公開するジョブを分け、id-token: write は公開の 1 ジョブだけに付ける
# (CI の門・build・依存の取得は OIDC のトークンを取れない側で走る)。
# 旧い secret PYPI_API_TOKEN は新方式での最初の公開を確かめるまで残すが、どこからも読まない
# (トークンへの fallback は書かない —— 公開の経路を 2 本にしない)。

# 既定は何も許さない。要る権限はジョブごとに書く。
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0        # タグの注釈(RELEASE-OVERRIDE)を読むため
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - name: Guard - tag matches pyproject version
        run: |
          V=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != pyproject v$V"; exit 1; }
      # ★**この門が無かった。** 0.1.6 / 0.1.7 / 0.1.8 は Linux CI が赤のまま
      # PyPI に出ている —— release は CI に依存していないので、赤でも publish できた。
      # 「見落とした」のではなく**門がそもそも無かった**。
      #
      # 迂回はできる(上流の一時的な不調で出せなくなるのは困る)が、
      # **迂回したことが必ず記録に残る**: タグの注釈に
      # `RELEASE-OVERRIDE: <理由>` を書いた場合だけ通す。
      #   例: git tag -a v0.1.9 -F msg.txt   (msg.txt の末尾に
      #       RELEASE-OVERRIDE: 上流 CVE で pip-audit が落ちるだけ  と書く)
      # 数えるのは「この repo の ci.yml が master への push で走った run」だけ(2026-10-24 の
      # レビュー): 名前 "CI" だけで選ぶと、同じ SHA の pull_request の run や、fork が足した
      # 同名の workflow でも条件を満たしてしまう。
      - name: Guard - CI is green for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.sha }}"
          NOTE=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          if printf '%s' "$NOTE" | grep -q 'RELEASE-OVERRIDE:'; then
            echo "::warning::CI ゲートを明示的に迂回しました —— $(printf '%s' "$NOTE" | grep 'RELEASE-OVERRIDE:')"
            exit 0
          fi
          CONC=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=$SHA&per_page=50"                  --jq '[.workflow_runs[] | select(.path==".github/workflows/ci.yml" and .event=="push" and .head_branch=="master" and .head_repository.full_name==env.GITHUB_REPOSITORY)] | sort_by(.created_at) | last | .conclusion')
          echo "CI conclusion for $SHA: ${CONC:-<none>}"
          if [ "$CONC" != "success" ]; then
            echo "CI がこのコミットで緑ではありません(${CONC:-未実行})。"
            echo "意図して出すなら、タグの注釈に 'RELEASE-OVERRIDE: <理由>' を書いて打ち直してください。"
            exit 1
          fi
      # build の版を固定する(公開物を作る道具が黙って変わらないように)。ci.yml の
      # core-minimal も同じ版で建てる。上げるときは両方を同じ commit で。
      - name: Build sdist + wheel
        run: |
          pip install "build==1.6.1"
          python -m build
      - name: Upload the distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    # GitHub の environment `pypi`(v* タグからだけ使える)。PyPI 側の公開元もこの名前で登録してある。
    environment:
      name: pypi
      url: https://pypi.org/p/fullseye
    permissions:
      id-token: write        # Trusted Publishing の OIDC トークン。これ以外は何も要らない(checkout もしない)
    steps:
      - name: Download the distributions built above
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
