name: C API natural consumer

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  c-api-natural-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
      - name: Install the default package only
        run: python -m pip install -e . pytest
      - name: Build external C and C++ consumers without runtime environment variables
        run: python -m pytest tests/test_c_api_sdk_static.py tests/test_c_api_natural_sdk.py -q
