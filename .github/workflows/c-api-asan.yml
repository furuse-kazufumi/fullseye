name: C API ASan

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  c-api-full-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
      - name: Install native and callable-op dependencies
        run: python -m pip install -e '.[native,opencv,skimage,pil,volume,wavelets]' pytest
      - name: Install every backend that contributes to the full registry
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.13"
          pip install "kornia>=0.9" "mahotas>=1.4"
          pip uninstall -y opencv-python
          pip install "opencv-contrib-python>=4.8.1.78"
          python -c "import torch, kornia, mahotas, pywt, cv2; print(torch.__version__, cv2.__version__, pywt.__version__); assert hasattr(cv2, 'xfeatures2d')"
      - name: Build the C API
        run: |
          cmake -S . -B build-c-api-full -DFULLSEYE_BUILD_NATIVE=ON \
            -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"
          cmake --build build-c-api-full --parallel 2
      - name: Match the full generated ledger; skips are failures
        env:
          FULLSEYE_REQUIRE_OPTIONAL: "1"
          FULLSEYE_C_API_LIBRARY: ${{ github.workspace }}/build-c-api-full/libfullseye.so
        run: |
          set -o pipefail
          python -m pytest \
            tests/test_c_api_pybind11.py::test_every_typed_c_sdk_operator_matches_direct_python_on_a_contract_probe \
            tests/test_c_api_pybind11.py::test_generated_catalog_and_fs_find_ops_json_have_the_same_callable_rows \
            -q -rs | tee pytest-full-registry.log
          if grep -q 'SKIPPED' pytest-full-registry.log; then
            echo 'full-registry gates must not skip' >&2
            exit 1
          fi

  c-api-asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
      - name: Install native and color-view (OpenCV) test dependencies
        run: python -m pip install -e '.[native,opencv]' pytest
      - name: Build the C API with AddressSanitizer and UBSan
        run: >-
          cmake -S . -B build-c-api-asan -DFULLSEYE_BUILD_NATIVE=ON
          -DFULLSEYE_BUILD_TESTS=ON -DFULLSEYE_ENABLE_SANITIZERS=ON
          -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"
      - run: cmake --build build-c-api-asan --parallel 2
      - name: Run CTest and ctypes hardening tests under sanitizers
        env:
          # libpython on the hosted runner omits frame pointers.  Slow unwinding
          # and a 64-frame allocation trace keep the whole CPython provenance
          # visible to LSan instead of stopping in _PyObject_Malloc.
          ASAN_OPTIONS: detect_leaks=1:fast_unwind_on_malloc=0:malloc_context_size=64
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/native/lsan.supp:print_suppressions=1
          FULLSEYE_C_API_LIBRARY: ${{ github.workspace }}/build-c-api-asan/libfullseye.so
        # pytest loads the C++ ABI bridge with ctypes, after ASan has started. Preload its
        # C++ exception runtime too, so ASan can intercept __cxa_throw when a Python
        # validation error crosses pybind11. (Kept outside run: so no comment leads the script.)
        run: |
          export LD_PRELOAD="$(gcc -print-file-name=libasan.so):$(g++ -print-file-name=libstdc++.so)"
          ctest --test-dir build-c-api-asan --output-on-failure
          python -m pytest tests/test_c_api_pybind11.py -q
